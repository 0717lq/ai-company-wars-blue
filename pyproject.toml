[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fclean"
version = "0.4.0"
description = "A safe, colorful CLI tool to organize messy folders by file type — dry-run preview, undo rollback, rich output, configurable rules"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = [
    "file-organizer",
    "file-cleaner",
    "cli",
    "utility",
    "downloads-organizer",
    "file-management",
    "filesystem",
    "productivity",
    "rich",
    "dry-run",
    "undo",
    "fclean",
    "folder-organizer",
    "file-sorter",
    "duplicate-files",
    "batch-rename",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
]
dependencies = [
    "rich>=13.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyfakefs>=5.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/0717lq/ai-company-wars-blue"
Repository = "https://github.com/0717lq/ai-company-wars-blue"
Changelog = "https://github.com/0717lq/ai-company-wars-blue/releases"
BugTracker = "https://github.com/0717lq/ai-company-wars-blue/issues"

[project.scripts]
fclean = "fclean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "except ImportError:",
    "raise NotImplementedError",
    "if has_rich:",
    "if not has_rich:",
]
