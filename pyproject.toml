[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fclean"
version = "0.1.0"
description = "A safe, colorful CLI tool to organize messy folders by file type"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["cleaner", "file-organizer", "cli", "utility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]
dependencies = []

[project.scripts]
fclean = "fclean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
