[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-builder"
version = "0.4.0"
description = "RAG pipeline builder toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "pipeline-builder",
    "config-validation",
    "scaffolding",
    "benchmark",
    "embedding",
    "vector-search",
    "hybrid-retrieval",
    "reranker",
    "chunking",
    "ragas",
    "milvus",
    "chroma",
    "bge",
    "pdf-parsing",
    "query-decomposition",
    "knowledge-base",
    "hermes-agent",
    "skill",
    "cli",
    "python",
    "bm25",
    "rrf",
    "health-check",
    "diagnose",
    "document-parser",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/0717lq/ai-company-wars-blue"
Repository = "https://github.com/0717lq/ai-company-wars-blue"
BugTracker = "https://github.com/0717lq/ai-company-wars-blue/issues"
Changelog = "https://github.com/0717lq/ai-company-wars-blue/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]
st = ["sentence-transformers>=2.2"]
openai = ["openai>=1.0"]
milvus = ["pymilvus>=2.4"]
chromadb = ["chromadb>=0.4"]
pdf = ["pymupdf>=1.23"]
bm25 = ["rank-bm25>=0.2", "jieba>=0.42"]
all = [
    "sentence-transformers>=2.2",
    "openai>=1.0",
    "pymilvus>=2.4",
    "chromadb>=0.4",
    "pymupdf>=1.23",
    "rank-bm25>=0.2",
    "jieba>=0.42",
]

[project.scripts]
rag-builder = "rag_builder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
