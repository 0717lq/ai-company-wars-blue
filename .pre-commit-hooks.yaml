# fclean pre-commit hook 定义
# 用法: 在 .pre-commit-config.yaml 中添加:
#   repos:
#     - repo: https://github.com/0717lq/ai-company-wars-blue
#       rev: v0.5.0
#       hooks:
#         - id: fclean-organize
#           args: [--execute]
#           stages: [pre-commit]

- id: fclean-organize
  name: fclean organize
  description: "自动按文件类型整理目录（fclean organize）"
  entry: fclean organize
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
  args: []
  # 默认 dry-run。用户在 .pre-commit-config.yaml 中加 args: [--execute] 才实际执行
