name: fclean CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Test with pytest and coverage
        run: |
          pytest tests/ -v --cov=src/ --cov-report=term --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/

  docker:
    name: Docker build test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fclean:test .

      - name: Verify Docker image
        run: docker run --rm fclean:test --help

      - name: Test JSON output via Docker
        run: |
          mkdir -p /tmp/fclean-test
          touch /tmp/fclean-test/{a.txt,b.jpg,c.log}
          docker run --rm -v /tmp/fclean-test:/data fclean:test --json /data
